# https://ko.wikisource.org/wiki/하늘과_바람과_별과_시_(1948년)/별_헤는_밤
# https://ko.wikisource.org/wiki/청춘예찬
id: Korean
source: >-
  Text borrowed from 메밀꽃 필 무렵 by Yi Hyo-seok, 별 헤는 밤 by Yun Dong-ju,
  and 청춘예찬 by Min Tae-won.
paragraphs:
  - >-
    이지러는 졌으나 보름을 갓 지난 달은 부드러운 빛을 흔붓이 흘리고 있다.
    대화까지는 팔십 리의 밤길, 고개를 둘이나 넘고 개울을 하나 건너고 벌판과 산길을 걸어야 된다.
    길은 지금 긴 산허리에 걸려 있다.
    밤중을 지난 무렵인지 죽은 듯이 고요한 속에서 짐승 같은 달의 숨소리가 손에 잡힐 듯이 들리며,
    콩 포기와 옥수수 잎새가 한층 달에 푸르게 젖었다.
    산허리는 온통 메밀 밭이어서 피기 시작한 꽃이 소금을 뿌린 듯이 흐붓한 달빛에 숨이 막힐 지경이다.
    붉은 대공이 향기같이 애잔하고 나귀들의 걸음도 시원하다.
  - >-
    길이 좁은 까닭에 세 사람은 나귀를 타고 외줄로 늘어섰다.
    방울소리가 시원스럽게 딸랑딸랑 메밀 밭께로 흘러간다.
    앞장선 허 생원의 이야기 소리는 꽁무니에 선 동이에게는 확적히는 안 들렸으나,
    그는 그대로 개운한 제멋에 적적하지는 않았다.
  - >-
    계절이 지나가는 하늘에는 가을로 가득 차 있습니다.
    나는 아무 걱정도 없이 가을 속의 별들을 다 헤일 듯합니다.
    가슴속에 하나둘 새겨지는 별을 이제 다 못 헤는 것은 쉬이 아침이 오는 까닭이요,
    내일 밤이 남은 까닭이요, 아직 나의 청춘이 다하지 않은 까닭입니다.
    별 하나에 추억과 별 하나에 사랑과 별 하나에 쓸쓸함과
    별 하나에 동경과 별 하나에 시와 별 하나에 어머니, 어머니,
  - >-
    어머님, 나는 별 하나에 아름다운 말 한마디씩 불러 봅니다.
    소학교 때 책상을 같이 했던 아이들의 이름과, 패, 경, 옥 이런 이국 소녀들의 이름과
    벌써 아기 어머니 된 계집애들의 이름과, 가난한 이웃 사람들의 이름과,
    비둘기, 강아지, 토끼, 노새, 노루, '프랑시스 잠', '라이너 마리아 릴케' 이런 시인의 이름을 불러 봅니다.
  - >-
    청춘! 이는 듣기만 하여도 가슴이 설레는 말이다.
    청춘! 너의 두 손을 가슴에 대고, 물방아 같은 심장의 고동을 들어 보라.
    청춘의 피는 끓는다. 끓는 피에 뛰노는 심장은 거선의 기관같이 힘있다.
    이것이다. 인류의 역사를 꾸며 내려온 동력은 바로 이것이다.
    이성은 투명하되 얼음과 같으며, 지혜는 날카로우나 갑 속에 든 칼이다.
    청춘의 끓는 피가 아니더면, 인간이 얼마나 쓸쓸하랴? 얼음에 싸인 만물은 죽음이 있을 뿐이다.
  - >-
    그들에게 생명을 불어넣는 것은 따뜻한 봄바람이다.
    풀밭에 속잎 나고, 가지에 싹이 트고, 꽃 피고 새 우는 봄날의 천지는 얼마나 기쁘며, 얼마나 아름다우냐?
    이것을 얼음 속에서 불러내는 것이 따뜻한 봄바람이다.
    인생에 따뜻한 봄바람을 불어 보내는 것은 청춘의 끓는 피다.
    청춘의 피가 뜨거운지라, 인간의 동산에는 사랑의 풀이 돋고, 이상의 꽃이 피고,
    희망의 놀이 뜨고, 열락의 새가 운다.
